<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json">
<title>My Note</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f6;color:#222;overscroll-behavior:none}
button,input{font:inherit}.top{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;gap:10px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0;flex:1}.btn{border:0;border-radius:10px;padding:9px 12px;background:#eee}.primary{background:#222;color:#fff}
#books{padding:16px;max-width:760px;margin:auto}.book{background:#fff;border-radius:14px;padding:17px;margin-bottom:11px;box-shadow:0 1px 4px #0001}.book b{display:block;font-size:18px}.book small{color:#888}.fab{position:fixed;right:20px;bottom:20px;border:0;border-radius:50%;width:58px;height:58px;background:#222;color:#fff;font-size:30px;z-index:8}
#note{display:none}.pagebar{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid #ddd}.page{min-width:48px;height:38px;border:1px solid #ccc;border-radius:8px;background:#fff}.page.sel{background:#222;color:#fff}
.toolbar{display:flex;gap:6px;overflow:auto;padding:8px;background:#fff;border-bottom:1px solid #ddd}.tool{white-space:nowrap}.tool.active{background:#222;color:#fff}
#sheetWrap{padding:16px;display:flex;justify-content:center;min-height:calc(100vh - 160px)}#sheet{position:relative;width:min(100%,760px);aspect-ratio:1/1.414;background:#fff;box-shadow:0 2px 10px #0002;overflow:hidden;touch-action:none}
#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.text{position:absolute;min-width:100px;min-height:34px;border:1px dashed #999;background:#ffffffe8;padding:6px;outline:0;font-size:18px;line-height:1.5;white-space:pre-wrap;resize:both;overflow:auto;touch-action:none}.text:focus{border:2px solid #555}.textwrap{position:absolute}.pic{position:absolute;max-width:80%;max-height:70%;touch-action:none;user-select:none}
#file{display:none}.hint{padding:18px;color:#777;text-align:center}
</style></head><body>
<section id="home"><header class="top"><h1>📓 My Note</h1></header><main id="books"></main><button class="fab" onclick="newBook()">＋</button></section>
<section id="note"><header class="top"><button class="btn" onclick="home()">←</button><h1 id="bookTitle"></h1><button class="btn" onclick="renameBook()">名前</button></header>
<div class="pagebar" id="pages"></div>
<div class="toolbar">
<button class="btn tool active" id="pen" onclick="mode('pen')">✏️ ペン</button>
<button class="btn tool" onclick="mode('high')">🖍️ 蛍光</button>
<button class="btn tool" onclick="mode('erase')">🧹 消しゴム</button>
<button class="btn tool" onclick="addText()">T 文字</button><button class="btn tool" onclick="fontSize(-2)">A−</button><button class="btn tool" onclick="fontSize(2)">A＋</button>
<button class="btn tool" onclick="pickImage()">🖼️ 画像</button>
<button class="btn tool" onclick="undo()">↩️</button><button class="btn tool" onclick="redo()">↪️</button>
<input id="file" type="file" accept="image/*" onchange="addImage(event)">
</div><div id="sheetWrap"><div id="sheet"><canvas id="draw"></canvas></div></div>
</section>
<script>
const KEY="myNoteBooksV1";let books=JSON.parse(localStorage.getItem(KEY)||"[]"),bi=0,pi=0,tool="pen",drawing=false,last=null,history=[],future=[];
function save(){localStorage.setItem(KEY,JSON.stringify(books))}
function home(){document.getElementById("note").style.display="none";document.getElementById("home").style.display="block";renderBooks()}
function renderBooks(){let e=document.getElementById("books");e.innerHTML=books.length?books.map((b,i)=>`<div class="book" onclick="openBook(${i})"><b>${esc(b.name)}</b><small>${b.pages.length}ページ</small></div>`).join(""):'<div class="hint">右下の「＋」からノートを作成できます。</div>'}
function newBook(){let n=prompt("ノート名","新しいノート");if(!n)return;books.push({name:n,pages:[blank()]});save();openBook(books.length-1)}
function blank(){return {strokes:[],texts:[],images:[]}}
function openBook(i){bi=i;pi=0;document.getElementById("home").style.display="none";document.getElementById("note").style.display="block";document.getElementById("bookTitle").textContent=books[bi].name;renderPages();loadPage()}
function renderPages(){document.getElementById("pages").innerHTML=books[bi].pages.map((_,i)=>`<button class="page ${i===pi?'sel':''}" onclick="goPage(${i})">${i+1}</button>`).join("")+`<button class="page" onclick="addPage()">＋</button>`}
function goPage(i){pi=i;renderPages();loadPage()}
function addPage(){books[bi].pages.push(blank());pi=books[bi].pages.length-1;save();renderPages();loadPage()}
function renameBook(){let n=prompt("ノート名",books[bi].name);if(n){books[bi].name=n;document.getElementById("bookTitle").textContent=n;save();renderBooks()}}
function setupCanvas(){let c=document.getElementById("draw"),s=document.getElementById("sheet");c.width=s.clientWidth*2;c.height=s.clientHeight*2;c.style.width=s.clientWidth+"px";c.style.height=s.clientHeight+"px";let x=c.getContext("2d");x.scale(2,2);return x}
function loadPage(){let s=books[bi].pages[pi],sheet=document.getElementById("sheet");sheet.querySelectorAll(".text,.pic").forEach(x=>x.remove());let c=document.getElementById("draw"),ctx=setupCanvas();ctx.lineCap="round";ctx.lineJoin="round";s.strokes.forEach(a=>{ctx.beginPath();a.points.forEach((p,j)=>j?ctx.lineTo(p.x*c.clientWidth,p.y*c.clientHeight):ctx.moveTo(p.x*c.clientWidth,p.y*c.clientHeight));ctx.strokeStyle=a.color;ctx.lineWidth=a.width;ctx.globalAlpha=a.alpha||1;ctx.stroke()});ctx.globalAlpha=1;s.texts.forEach((t,i)=>{
 let e=document.createElement("div");e.className="text";e.contentEditable=true;e.textContent=t.text;
 e.style.left=t.x*100+"%";e.style.top=t.y*100+"%";e.style.width=t.w*100+"%";
 e.style.fontSize=(t.size||18)+"px";
 e.oninput=()=>{t.text=e.innerText;t.w=e.offsetWidth/sheet.clientWidth;t.h=e.offsetHeight/sheet.clientHeight;save()};
 e.onpointerdown=(ev)=>{if(ev.target!==e)return; ev.stopPropagation(); moveText(e,t,ev)};
 e.addEventListener("blur",()=>{t.text=e.innerText;save()});
 sheet.appendChild(e)
});s.images.forEach((im,i)=>{let e=document.createElement("img");e.className="pic";e.src=im.src;e.style.left=im.x*100+"%";e.style.top=im.y*100+"%";e.style.width=im.w*100+"%";sheet.appendChild(e);makeDrag(e,im)});history=[];future=[]}
function mode(m){tool=m;document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));event.currentTarget.classList.add("active")}
function pos(e){let r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
draw.addEventListener("pointerdown",e=>{if(tool==="erase")return;drawing=true;last=pos(e);let s=books[bi].pages[pi];s.strokes.push({points:[last],color:tool==="high"?"#ffd400":"#222",width:tool==="high"?18:3,alpha:tool==="high"?.35:1});draw.setPointerCapture(e.pointerId)})
draw.addEventListener("pointermove",e=>{if(!drawing)return;let p=pos(e),s=books[bi].pages[pi],a=s.strokes.at(-1),ctx=draw.getContext("2d");ctx.beginPath();ctx.moveTo(last.x*draw.clientWidth,last.y*draw.clientHeight);ctx.lineTo(p.x*draw.clientWidth,p.y*draw.clientHeight);ctx.strokeStyle=a.color;ctx.lineWidth=a.width;ctx.globalAlpha=a.alpha;ctx.lineCap="round";ctx.stroke();ctx.globalAlpha=1;a.points.push(p);last=p})
draw.addEventListener("pointerup",()=>{if(drawing){drawing=false;save()}})
function addText(){
 let s=books[bi].pages[pi],t={text:"ここに入力",x:.12,y:.12,w:.45,size:18};
 s.texts.push(t);save();loadPage();
 setTimeout(()=>{let es=document.querySelectorAll(".text");let e=es[es.length-1];e.focus();document.execCommand("selectAll",false,null)},30)
}
function fontSize(delta){
 let es=[...document.querySelectorAll(".text")],e=es.find(x=>x===document.activeElement);
 if(!e && es.length)e=es[es.length-1];
 if(!e)return;
 let n=Math.max(10,Math.min(60,parseInt(getComputedStyle(e).fontSize)+delta));
 e.style.fontSize=n+"px";
 let i=es.indexOf(e);books[bi].pages[pi].texts[i].size=n;save();
}
function moveText(el,t,start){
 let sx=start.clientX,sy=start.clientY,ox=t.x,oy=t.y,r=sheet.getBoundingClientRect();
 const mv=e=>{t.x=Math.max(0,Math.min(.9,ox+(e.clientX-sx)/r.width));t.y=Math.max(0,Math.min(.95,oy+(e.clientY-sy)/r.height));el.style.left=t.x*100+"%";el.style.top=t.y*100+"%"};
 const up=()=>{el.releasePointerCapture?.(start.pointerId);el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);save()};
 el.setPointerCapture(start.pointerId);el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);
}
function pickImage(){document.getElementById("file").click()}
function addImage(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im={src:r.result,x:.1,y:.15,w:.55};books[bi].pages[pi].images.push(im);save();loadPage()};r.readAsDataURL(f);ev.target.value=""}
function makeDrag(el,im){let sx,sy,ox,oy;el.addEventListener("pointerdown",e=>{e.stopPropagation();sx=e.clientX;sy=e.clientY;ox=im.x;oy=im.y;el.setPointerCapture(e.pointerId)});el.addEventListener("pointermove",e=>{if(sx==null)return;let r=document.getElementById("sheet").getBoundingClientRect();im.x=ox+(e.clientX-sx)/r.width;im.y=oy+(e.clientY-sy)/r.height;el.style.left=im.x*100+"%";el.style.top=im.y*100+"%"});el.addEventListener("pointerup",()=>{sx=null;save()})}
function undo(){let s=books[bi].pages[pi];if(s.strokes.length){future.push(s.strokes.pop());loadPage();save()}}
function redo(){let s=books[bi].pages[pi];if(future.length){s.strokes.push(future.pop());loadPage();save()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderBooks();addEventListener("resize",()=>{if(document.getElementById("note").style.display==="block")loadPage()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
